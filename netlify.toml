[build]
  command = "npm run build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["googleapis", "firebase-admin"]

[functions."query-candidates"]
  timeout = 26

[functions."generate-rebuttal"]
  timeout = 26

[functions."browse-drive"]
  timeout = 26

[functions."fetch-community-notes"]
  timeout = 26

[functions."scheduled-community-notes"]
  schedule = "0 6 * * *"
  timeout = 26

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
