[build]
  command = "npm run build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["googleapis"]

[functions."query-candidates"]
  timeout = 26

[functions."generate-rebuttal"]
  timeout = 26

[functions."browse-drive"]
  timeout = 26

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
