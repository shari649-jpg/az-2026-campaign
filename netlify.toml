[build]
  command = "npm run build"
  publish = "dist"

[functions]
  external_node_modules = ["googleapis", "@netlify/blobs", "@netlify/functions", "firebase-admin"]

[functions."query-candidates"]
  timeout = 26

[functions."generate-message"]
  timeout = 26

[functions."generate-rebuttal"]
  timeout = 26

[functions."generate-storm-text"]
  timeout = 26

[functions."rapid-response"]
  timeout = 26

[functions."browse-drive"]
  timeout = 26

[functions."fetch-community-notes"]
  timeout = 26

[functions."scheduled-community-notes"]
  timeout = 26

[functions."send-invite"]
  timeout = 26

[functions."send-welcome"]
  timeout = 10

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions."validate-token"]
  timeout = 10

[functions."manage-user"]
  timeout = 15

[functions."coaching-response"]
  timeout = 26

[functions."resend-verification"]
  timeout = 26

  [functions."notify-waitlist-signup"]
  timeout = 10
