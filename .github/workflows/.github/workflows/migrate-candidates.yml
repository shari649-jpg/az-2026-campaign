name: Migrate Candidates to Firestore

# Manual-only trigger — this never runs automatically. You start it by
# clicking a button on the Actions tab of the repo on GitHub.com.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only (preview, no writes to Firestore)"
        type: boolean
        default: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      # Writes your two credential Secrets out to actual JSON files, fresh,
      # inside this temporary cloud machine only. Nothing here is saved to
      # the repo, and this machine is thrown away the moment the run ends.
      - name: Write credential files
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$GOOGLE_SA_JSON" > google-service-account.local.json
          echo "$FIREBASE_SA_JSON" > firebase-service-account.local.json

      - name: Run migration
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/migrate-candidates-to-firestore.mjs --dry-run
          else
            node scripts/migrate-candidates-to-firestore.mjs
          fi
